      "three": "/js/threejs/three.module.js",

    }

<script type="module">
  var capturer = new CCapture( { format: 'webm' } );

  import * as THREE from 'three';

  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  const w = 300;
  const h = 300;

  let camera, controls, scene, renderer;

  init();
  // render();
  animate();

  function init() {

    const container = document.createElement( 'div' )
    const loader = new GLTFLoader().setPath( '/2025/ccapture/' )
    scene = new THREE.Scene({})


    /* fov — Camera frustum vertical field of view.
     * aspect — Camera frustum aspect ratio.
     * near — Camera frustum near plane.
     * far — Camera frustum far plane.
    **/
    // camera = new THREE.PerspectiveCamera( 45, w/h, 1, 1600 )
    // camera.position.set( -1.8, 0.6, 2.7 )
    /* loader.load( 'cyberpunk-laptop/cyberpunk-laptop.glb', function ( gltf ) {
      $("#rotatingC span.label").css('display', 'none')
      document.getElementById('rotatingC').appendChild( container )
      scene.add( gltf.scene )
      render()
    } ); */


    camera = new THREE.PerspectiveCamera( 1, w/h, 1, 1600 )
    camera.position.set( 0, 0.5, 20 )
    camera.lookAt(0, 0, 0)
    camera.position.z = 3   // closer
    camera.position.z = 1   // very close
    const light = new THREE.DirectionalLight(0xffffff, 1.2)
    light.position.set(5, 10, 7)
    light.target.position.set(0, 0, 0)
    scene.add(light)
    scene.add(light.target)
    loader.load( 'tank-hafen/hafen.glb', function ( gltf ) {
      $("#rotatingC span.label").css('display', 'none')
      document.getElementById('rotatingC').appendChild( container )
      scene.add( gltf.scene )
      capturer.start();
      render()
    } );


    renderer = new THREE.WebGLRenderer({
      alpha: true,
      antialias: true,
    });
    // renderer.setClearColor( 0x000000, 0 ); // default
    renderer.setPixelRatio( window.devicePixelRatio );
    renderer.setSize( w, h );
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1;
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild( renderer.domElement );

    controls = new OrbitControls( camera, renderer.domElement );
    // controls.addEventListener( 'change', render ); // use if there is no animation loop
    controls.minDistance = 400;
    controls.maxDistance = 800;
    controls.target.set( 0, 0, - 0.2 );
    controls.autoRotate = true;
    controls.update();

    window.addEventListener( 'resize', onWindowResize );
  }

  function onWindowResize() {
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize( w, h );
    render();
  }

  function render() {
    renderer.render( scene, camera );
  }
  function animate() {
    requestAnimationFrame( animate );
    controls.update();
    renderer.render( scene, camera );
    capturer.capture( renderer.domElement );
  }

  setTimeout(function() {
    capturer.stop();
    capturer.save();
  }, 5 * 1000)

</script>

<h1 class='center text-center'>{{ label }}</h1>

<div id="rotatingC" class="r2" style="width: 300px;
  height: 300px;
  border: 1px solid red;
  text-align: center; " >
    <span class="label">Loading...</span>
</div>
