<html>
<head>
  <title>test_threejs demos</title>
  <style>
    body {
      background: #efefef;
    }
  </style>

  <!-- Import maps polyfill -->
  <!-- Remove this when import maps will be widely supported -->
  <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/2025/vendor/js/CCapture.all.min.js"></script>

  <script type="importmap">
    { "imports":
      {
        "three": "/2025/vendor/js/threejs/three.module.js",
        "three/addons/": "/2025/vendor/js/threejs/jsm/",
        "talkinghead": "/2025/vendor/js/talkinghead.mjs"
      }
    }
  </script>


</head>
<body>
  <h1 class='center text-center'>{{ label }}</h1>
  <div id='avatar'></div>
  <div id='loading'>Loading...</div>
  <div id="rotatingC" class="r2" style="width: 640px;
    height: 480px;
    border: 1px solid red;
    text-align: center; " >
  </div>

  <script type="module">

    import * as THREE from 'three';

    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    // import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
    // import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    import { TalkingHead } from "talkinghead";

    const w = 640;
    const h = 480;
    let config = {
        sampleRate: 8000,
        mood: 'neutral',
        gain: 0.5,
        lipsyncType: "visemes",
        lipsyncLang: "en",
        waitForAudioChunks: false,
        enableMetrics: false,
      };

    const logg = (a, b="", c=null) => {
      if ('undefined' === typeof window) { return }

      c = "string" === typeof c ? c : b.replace(/\W/g, "");
      if (c.length > 0) {
        window[c] = a;
      }
      console.log(`+++ ${b}:`, a); // eslint-disable-line no-console
    };

    let camera, controls, head, renderer, scene;
    var capturer = new CCapture( { format: 'webm' } );
    const clock = new THREE.Clock();

    let chunkedInput = {
            "phonemes":["ə","l","O","m","I","n","A","m","ɪ","z","æ","l","ɪ","s"],
            "words":["Hello, ","my ","name ","is ","Alice"],
            "wtimes":[449,984,1104,1268,1428],
            "wdurations":[555,140,184,180,715],
            "visemes":["E","RR","O","PP","I","nn","E","PP","I","SS","aa","RR","I","SS"],
            "vtimes":[499,550,601,984,1011,1104,1129,1217,1268,1336,1428,1551,1624,1709],
            "vdurations":[71,71,294,47,87,45,108,46,88,60,143,93,105,434],
            "audioEncoding":"wav" }

    async function init() {
      // const container = document.createElement( 'div' )
      const loader = new GLTFLoader().setPath( '/2025/vendor/obj' )
      scene = new THREE.Scene();

      /* fov — Camera frustum vertical field of view.
       * aspect — Camera frustum aspect ratio.
       * near — Camera frustum near plane.
       * far — Camera frustum far plane.
      **/
      camera = new THREE.PerspectiveCamera( 45, w/h, 0.1, 10 )
      // camera.position.set( -18, 6, 27 )
      camera.position.set( 0, 2, 2 )

      const ambientLight = new THREE.AmbientLight( 0xffffff );
      scene.add( ambientLight );

      // const pointLight = new THREE.PointLight( 0xffffff, 15 );
      // camera.add( pointLight );
      // scene.add( camera );



      // loader.load( '/cyberpunk-laptop/cyberpunk-laptop.glb', function ( gltf ) {
      //   $("#rotatingC span.label").css('display', 'none')
      //   document.getElementById('rotatingC').appendChild( container )
      //   scene.add( gltf.scene )
      // } );

      const nodeAvatar = document.getElementById('avatar');
      head = new TalkingHead( nodeAvatar, {
        avatarOnly: true,
        avatarOnlyCamera: camera,

        lipsyncModules: ["en"],
        // cameraView: "upper",
        // update: function () {
        //   capturer.capture( nodeAvatar );
        // }
      });
      logg(head, 'head')



      const nodeLoading = document.getElementById('loading');
      try {
        nodeLoading.textContent = "Loading...";
        await head.showAvatar( {
          url: 'https://models.readyplayer.me/64bfa15f0e72c63d7c3934a6.glb?morphTargets=ARKit,Oculus+Visemes,mouthOpen,mouthSmile,eyesClosed,eyesLookUp,eyesLookDown&textureSizeLimit=1024&textureFormat=png',
          body: 'F',
          avatarMood: 'neutral',
          lipsyncLang: 'en'
        }, (ev) => {
          if ( ev.lengthComputable ) {
            let val = Math.min(100,Math.round(ev.loaded/ev.total * 100 ));
            nodeLoading.textContent = "Loading " + val + "%";
          }
        });
        nodeLoading.style.display = 'none';


        setTimeout(() => {
          logg(head.armature.position, 'position')

          head.armature.position.set(1,0,0);
          head.armature.rotation.set(0,0.5,0);
          scene.add(head.armature);


        }, 2 * 1000)
        // render()

        // capturer.start();
        // head.streamStart({
        //     sampleRate: config.sampleRate,
        //     mood: config.mood,
        //     gain: config.gain,
        //     lipsyncType: config.lipsyncType,
        //     lipsyncLang: config.lipsyncLang,
        //     waitForAudioChunks: config.waitForAudioChunks,
        //     // Configure metrics: enabled/disabled and reporting rate
        //     metrics: config.enableMetrics ? { enabled: true, intervalHz: config.metricsInterval } : { enabled: false }
        //   })

      } catch (error) {
        console.log(error);
        nodeLoading.textContent = error.toString();
      }


      //

      renderer = new THREE.WebGLRenderer( {
        alpha: true,
        antialias: true,
      } );
      renderer.setPixelRatio( window.devicePixelRatio );
      renderer.setSize( w, h );
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1;
      renderer.outputEncoding = THREE.sRGBEncoding;
      document.getElementById('rotatingC').appendChild( renderer.domElement );

      //

      controls = new OrbitControls( camera, renderer.domElement );
      controls.enableDamping = true;
      controls.minDistance = 0.5;
      controls.maxDistance = 100;
      controls.autoRotate = false;
      controls.update();

      //

      window.addEventListener( 'resize', onWindowResize );





      renderer.setAnimationLoop(animate);
      animate();
    }

    let semafore = false
    document.addEventListener('DOMContentLoaded', async function(e) {
      if (!semafore) {
        semafore = true
        await init()
      }
    })

    function onWindowResize() {
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize( w, h );
      render();
    }

    function render() {
      renderer.render( scene, camera );
    }


    function animate() {
      const delta = clock.getDelta();
      head.animate(delta * 1000);
      controls.update();
      renderer.render( scene, camera );
    }


  </script>

</body>
</html>
